name: Build Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Visual Studio Build Tools
        uses: ilammy/msvc-dev-cmd@v1
      
      - name: Build Release
        run: cargo build --release
